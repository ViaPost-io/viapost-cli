name: Release CLI binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          check-latest: true
          cache: true
      - name: Require exact tag on main and matching version
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$EVENT_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          cli_version="$(sed -n 's/^var Version = "\([^"]*\)"/\1/p' internal/cli/root.go)"
          test -n "$cli_version"
          test "$RELEASE_TAG" = "v$cli_version"
      - run: make verify
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TZ: UTC
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="viapost_${version}_${os}_${arch}"
            binary="viapost"
            if [[ "$os" == windows ]]; then binary="viapost.exe"; fi
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/ViaPost-io/viapost-cli/internal/cli.Version=${version}" \
              -o "build/$name/$binary" ./cmd/viapost
            touch -d "@${source_date_epoch}" "build/$name/$binary"
            if [[ "$os" == windows ]]; then
              (cd "build/$name" && zip -X -q "../../dist/${name}.zip" "$binary")
            else
              tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 --numeric-owner \
                -C "build/$name" -cf - "$binary" | gzip -n > "dist/${name}.tar.gz"
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          chmod -R a-w dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-release
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: cli-release
          path: dist
      - name: Publish verified binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_assets="$(for file in dist/*; do basename "$file"; done | LC_ALL=C sort)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$release_is_draft" == false ]]; then
              actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
              test "$actual_assets" = "$expected_assets"
              released="$(mktemp -d)"
              trap 'rm -rf -- "$released"' EXIT
              gh release download "$RELEASE_TAG" --dir "$released"
              cmp dist/SHA256SUMS "$released/SHA256SUMS"
              (cd "$released" && sha256sum --check SHA256SUMS)
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          test "$actual_assets" = "$expected_assets"
          gh release edit "$RELEASE_TAG" --draft=false --latest

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: cli-release
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
