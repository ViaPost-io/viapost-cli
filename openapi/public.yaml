        - $ref: '#/components/schemas/MessageContent'
        - type: object
          required:
            - attachments
            - content_status
            - content_variant
          properties:
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/InboundAttachment'
            content_variant:
              type: string
              const: received
            raw_message_url:
              type: string
              format: uri
              deprecated: true
              description: URL S3 pré-assinada mantida temporariamente para compatibilidade; use raw_message_api_path.
            spf_result:
              $ref: '#/components/schemas/SPFAuthenticationResult'
            spf_aligned:
              anyOf:
                - type: boolean
                - type: 'null'
              description: Indica alinhamento SPF com o domínio From para DMARC; nulo quando não foi possível avaliar.
            dkim_result:
              $ref: '#/components/schemas/DKIMAuthenticationResult'
            dkim_aligned:
              anyOf:
                - type: boolean
                - type: 'null'
              description: Indica alinhamento de ao menos uma assinatura DKIM aprovada com o domínio From; nulo quando não foi possível avaliar.
            dmarc_result:
              $ref: '#/components/schemas/DMARCAuthenticationResult'
            dmarc_disposition:
              anyOf:
                - type: string
                  enum:
                    - none
                    - quarantine
                    - reject
                - type: 'null'
              description: Disposição calculada para esta avaliação DMARC, separada do resultado pass/fail.
            authentication_evaluated_at:
              anyOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
              description: Instante em que a autenticação foi avaliada no recebimento; nulo em registros legados ou não avaliados.
    Message:
