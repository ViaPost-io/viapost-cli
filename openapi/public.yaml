  /v1/broadcasts/{id}/test:
    post:
      operationId: postBroadcastsIdTest
      tags:
        - Broadcasts
      summary: Envia um teste do draft ao e-mail verificado do usuário autenticado
      description: |
        Envia o snapshot compilado somente ao próprio e-mail verificado do usuário que iniciou a
        chamada. Exige o scope específico `email:test` e `broadcasts:read`; não usa a audiência do
        broadcast. O recurso precisa continuar em draft e `expected_version` precisa corresponder.
        Domínio verificado, supressões, quota e demais gates da pipeline normal de envio continuam
        aplicáveis. Repetir uma chave de idempotência já usada não cria outra mensagem.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scopes:
        - broadcasts:read
        - email:test
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave opaca por tentativa (16–150 caracteres); o mesmo valor não deve ser reutilizado para nova prévia.
          schema:
            type: string
            minLength: 16
            maxLength: 150
            pattern: ^[!-~]+$
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expected_version
              additionalProperties: false
              properties:
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '202':
          description: E-mail de teste aceito pela pipeline
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
