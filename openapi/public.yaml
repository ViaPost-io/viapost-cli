  /v1/automations/{id}/runs:
    get:
      operationId: getAutomationsIdRuns
      tags:
        - Automations
      summary: GET /v1/automations/{id}/runs
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: automations:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AutomationCursor'
        - $ref: '#/components/parameters/AutomationLimit'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - running
              - completed
              - failed
              - cancelled
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRunList'
        '400':
