        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/suppressions:
    get:
      operationId: getSuppressions
      tags:
        - Suppressions
      summary: Lista supressões do tenant
      description: |
        Retorna somente supressões pertencentes ao tenant autenticado. A paginação usa cursor
        opaco e exclusivo. O estado é derivado de `released_at` e `expires_at`; por padrão,
        somente entradas ativas são retornadas. Diagnósticos SMTP brutos não fazem parte deste
        contrato e nunca são expostos.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: suppressions:read
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: Cursor opaco retornado em `next_cursor`.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: search
          in: query
          schema:
            type: string
            maxLength: 254
          description: Busca parcial sem diferenciação de maiúsculas no endereço.
        - name: reason
          in: query
          schema:
            $ref: '#/components/schemas/SuppressionReason'
        - name: state
          in: query
          schema:
            type: string
            enum:
              - active
              - expired
              - released
              - all
            default: active
        - name: origin
          in: query
          schema:
            $ref: '#/components/schemas/SuppressionOrigin'
      responses:
        '200':
          description: Página de supressões em ordem decrescente de atualização.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: postSuppressions
      tags:
        - Suppressions
      summary: Adiciona uma supressão manual
      description: |
        Normaliza o endereço antes de persistir. `manual` e `invalid_address` são os únicos
        motivos aceitos neste endpoint; motivos derivados de entrega ou consentimento são
        administrados automaticamente. Uma entrada encerrada pode ser reativada. Uma entrada
        ativa idêntica é idempotente, enquanto uma entrada ativa incompatível retorna `409`.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: suppressions:write
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSuppressionRequest'
      responses:
        '201':
          description: Supressão criada ou reativada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suppression'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/suppressions/import:
    post:
      operationId: postSuppressionsImport
      tags:
        - Suppressions
      summary: Importa supressões manuais de um CSV
      description: |
        Recebe UTF-8 com o cabeçalho exato `email,reason,expires_at,note`, no máximo 2 MiB e
        1.000 registros. `expires_at` e `note` podem ficar vazios. O arquivo inteiro é validado
        antes da escrita e a importação é atômica: qualquer linha inválida rejeita tudo.
        Endereços repetidos no mesmo arquivo são contabilizados em `duplicates`.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: suppressions:write
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Importação concluída atomicamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionImportResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/suppressions/export:
    get:
      operationId: getSuppressionsExport
      tags:
        - Suppressions
      summary: Exporta supressões do tenant em CSV
      description: |
        Exporta o conjunto filtrado com cabeçalho `email,reason,state,origin,expires_at,note,updated_at`.
        Valores iniciados por caracteres de fórmula são neutralizados para impedir formula
        injection ao abrir o arquivo em uma planilha. O CSV nunca contém diagnóstico SMTP bruto.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: suppressions:read
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 254
        - name: reason
          in: query
          schema:
            $ref: '#/components/schemas/SuppressionReason'
        - name: state
          in: query
          schema:
            type: string
            enum:
              - active
              - expired
              - released
              - all
            default: active
        - name: origin
          in: query
          schema:
            $ref: '#/components/schemas/SuppressionOrigin'
      responses:
        '200':
          description: Arquivo CSV UTF-8.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="viapost-suppressions.csv"
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
