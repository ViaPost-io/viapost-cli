                - none
            value:
              allOf:
                - $ref: '#/components/schemas/ContactTagIDs'
              minItems: 1
    TextAttributePredicate:
      type: object
      additionalProperties: false
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          enum:
            - email
            - first_name
            - last_name
        operator:
          type: string
          enum:
            - eq
            - neq
            - contains
            - starts_with
            - ends_with
        value:
          type: string
          minLength: 1
          maxLength: 256
    TextPresencePredicate:
      type: object
      additionalProperties: false
      required:
        - field
        - operator
      properties:
        field:
          type: string
          enum:
            - email
            - first_name
            - last_name
        operator:
          type: string
          enum:
            - is_set
            - is_not_set
    SubscribedPredicate:
      type: object
      additionalProperties: false
      required:
        - field
        - operator
        - value
      properties:
        field:
          const: subscribed
        operator:
          const: eq
        value:
          type: boolean
    CreatedAtPredicate:
      type: object
      additionalProperties: false
      required:
        - field
        - operator
        - value
      properties:
        field:
          const: created_at
        operator:
          type: string
          enum:
            - before
            - after
        value:
          $ref: '#/components/schemas/SegmentTimestamp'
    PropertyValuePredicate:
      type: object
      additionalProperties: false
      required:
        - field
        - key
        - operator
        - value
      properties:
        field:
          const: property
        key:
          type: string
          minLength: 1
          maxLength: 128
        operator:
          type: string
          enum:
            - eq
            - neq
        value:
          type:
            - string
            - number
            - boolean
    PropertyPresencePredicate:
      type: object
      additionalProperties: false
      required:
        - field
        - key
        - operator
      properties:
        field:
          const: property
        key:
          type: string
          minLength: 1
          maxLength: 128
        operator:
          type: string
          enum:
            - exists
            - not_exists
    CustomEventPredicate:
      type: object
      additionalProperties: false
      required:
        - event_name
        - operator
        - within_days
      properties:
        event_name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^(?!viapost:)[A-Za-z][A-Za-z0-9_-]*(\\.[A-Za-z0-9_-]+)*$
        operator:
          const: occurred
        within_days:
          type: integer
          minimum: 1
          maximum: 90
    EmailTemplate:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        current_draft_version_id:
          type: string
          format: uuid
        published_version_id:
          type: string
          format: uuid
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    TemplateVariable:
      type: object
      required:
        - name
        - var_type
      properties:
        name:
          type: string
        var_type:
          type: string
          enum:
            - string
            - number
        fallback_value:
          anyOf:
            - type: string
            - type: 'null'
    EmailTemplateVersion:
      type: object
      required:
        - id
        - version_number
        - status
        - content_json
        - variables
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        version_number:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - draft
            - published
            - superseded
        subject:
          type: string
        content_json:
          type: object
          additionalProperties: true
        compiled_html:
          type: string
        compiled_text:
          type: string
        published_at:
          $ref: '#/components/schemas/Timestamp'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/TemplateVariable'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    TemplateList:
      type: object
      required:
        - templates
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/EmailTemplate'
    CreateTemplateRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
    CreateTemplateResponse:
      type: object
      required:
        - template
        - draft
      properties:
        template:
          $ref: '#/components/schemas/EmailTemplate'
        draft:
          $ref: '#/components/schemas/EmailTemplateVersion'
    TemplatePreconditionRequest:
      type: object
      additionalProperties: false
      dependentRequired:
        expected_version_id:
          - expected_updated_at
        expected_updated_at:
          - expected_version_id
      properties:
        expected_version_id:
          $ref: '#/components/schemas/UUID'
        expected_updated_at:
          $ref: '#/components/schemas/Timestamp'
    UpdateTemplateDraftRequest:
      type: object
      additionalProperties: false
      required:
        - content_json
        - variables
      dependentRequired:
        expected_version_id:
          - expected_updated_at
        expected_updated_at:
          - expected_version_id
      properties:
        subject:
          anyOf:
            - type: string
            - type: 'null'
        content_json:
          type: object
          additionalProperties: true
        variables:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TemplateVariable'
        expected_version_id:
          $ref: '#/components/schemas/UUID'
        expected_updated_at:
          $ref: '#/components/schemas/Timestamp'
    UpdateTemplateDraftResponse:
      type: object
      required:
        - draft
        - preview_html
        - preview_text
      properties:
        draft:
          $ref: '#/components/schemas/EmailTemplateVersion'
        preview_html:
          type: string
        preview_text:
          type: string
    PreviewTemplateRequest:
      type: object
      additionalProperties: false
      properties:
        variables:
          type: object
          additionalProperties: true
          maxProperties: 100
    PreviewTemplateResponse:
      type: object
      required:
        - subject
        - html
        - text
      properties:
        subject:
          type: string
        html:
          type: string
        text:
          type: string
    TemplateVersionList:
      type: object
      required:
        - versions
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/EmailTemplateVersion'
    CreateTemplateAssetRequest:
      type: object
      additionalProperties: false
      required:
        - filename
        - content_type
      properties:
        filename:
          type: string
        content_type:
          type: string
    TemplateAssetPolicy:
      type: object
      additionalProperties: false
      required:
        - upload_url
        - upload_fields
        - asset_url
      properties:
        upload_url:
          type: string
          format: uri
        upload_fields:
          type: object
          additionalProperties:
            type: string
        asset_url:
          type: string
          format: uri
    Theme:
      type: object
      required:
        - id
        - name
        - style
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        style:
          type: object
          additionalProperties: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ThemeList:
      type: object
      required:
        - themes
      properties:
        themes:
          type: array
          items:
            $ref: '#/components/schemas/Theme'
    CreateThemeRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - style
      properties:
        name:
          type: string
        style:
          type: object
          additionalProperties: true
    WebhookLastDelivery:
      type: object
      additionalProperties: false
      required:
        - delivery_id
        - state
        - status
        - created_at
        - updated_at
        - response_code
        - duration_ms
      properties:
        delivery_id:
          $ref: '#/components/schemas/UUID'
        state:
          type: string
        status:
          type: string
          enum:
            - pending
            - delivered
            - failed
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        response_code:
          type:
            - integer
            - 'null'
          minimum: 100
          maximum: 599
        duration_ms:
          type:
            - integer
            - 'null'
          minimum: 0
    WebhookRequestedBy:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        kind:
          type: string
          enum:
            - user
            - api_key
    WebhookEventCatalog:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            type: object
            required:
              - type
              - category
              - description
              - source
              - emitted
              - subscribable
              - schema_version
              - example
            properties:
              type:
                type: string
              category:
                type: string
                enum:
                  - delivery
                  - engagement
                  - inbound
                  - diagnostic
              description:
                type: string
              source:
                type: string
              emitted:
                type: boolean
              subscribable:
                type: boolean
              schema_version:
                type: string
                const: '1'
              example:
                type: object
                additionalProperties: true
                description: Exemplo sintético do corpo da versão indicada.
              delivery_guarantee:
                type: string
                description: best_effort_legacy indica publisher sem outbox durável.
    WebhookMetrics:
      type: object
      description: Janela de criação inclusiva/exclusiva; padrão 30 dias e máximo 90 dias. Contagens limitadas à retenção disponível.
      required:
        - endpoint_total
        - endpoints_active
        - from
        - to
        - events_total
        - deliveries_total
        - delivered
        - failed
        - cancelled
        - pending
        - attempts_total
        - success_rate
        - average_duration_ms
        - p95_duration_ms
      properties:
        endpoint_total:
          type: integer
          minimum: 0
          description: Endpoints atuais do tenant; independente do período das entregas.
        endpoints_active:
          type: integer
          minimum: 0
          description: Endpoints atualmente ativos do tenant; independente do período das entregas.
        from:
          $ref: '#/components/schemas/Timestamp'
        to:
          $ref: '#/components/schemas/Timestamp'
        events_total:
          type: integer
          minimum: 0
          description: UUIDs distintos em jobs kind=event; exclui teste e replay.
        deliveries_total:
          type: integer
          minimum: 0
        delivered:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        attempts_total:
          type: integer
          minimum: 0
          description: Tentativas no período, inclusive sem duração.
        success_rate:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
          description: delivered dividido por delivered+failed+cancelled; null sem terminais.
        average_duration_ms:
          type:
            - number
            - 'null'
          minimum: 0
        p95_duration_ms:
          type:
            - integer
            - 'null'
          minimum: 0
    WebhookEndpoint:
      type: object
      additionalProperties: false
      required:
        - name
        - payload_version
        - last_delivery
        - id
        - url
        - event_types
        - enabled
        - max_attempts
        - consecutive_failures
        - disabled_at
        - secret_rotated_at
        - version
        - created_at
        - updated_at
      properties:
        name:
          type: string
          maxLength: 100
          description: Nome opcional do endpoint; vazio em registros legados sem nome.
        payload_version:
          type: string
          const: '1'
          readOnly: true
        last_delivery:
          anyOf:
            - $ref: '#/components/schemas/WebhookLastDelivery'
            - type: 'null'
        id:
          $ref: '#/components/schemas/UUID'
        url:
          type: string
          format: uri
          pattern: ^https://
          description: URL HTTPS pública, sem credenciais ou fragmento; destinos privados são rejeitados.
        description:
          type:
            - string
            - 'null'
          maxLength: 200
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            description: Inclui inscrições legadas armazenadas.
        enabled:
          type: boolean
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
        consecutive_failures:
          type: integer
          minimum: 0
        disabled_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        secret_rotated_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    WebhookSubscribableEventType:
      type: string
      enum:
        - sent
        - delivered
        - deferred
        - hard_bounce
        - open
        - click
        - unsubscribe
        - failed
        - suppressed
    WebhookDeliveryEventType:
      type: string
      description: Tipo persistido, incluindo eventos legados e webhook.test.
    WebhookList:
      type: object
      additionalProperties: false
      required:
        - webhooks
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
        next_cursor:
          type: string
          description: Ausente na última página.
    CreateWebhookRequest:
      type: object
      additionalProperties: false
      required:
        - url
        - event_types
      properties:
        name:
          type: string
          maxLength: 100
        enabled:
          type: boolean
          default: true
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        url:
          type: string
          format: uri
          pattern: ^https://
        description:
          type: string
          maxLength: 200
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookSubscribableEventType'
    CreateWebhookResponse:
      type: object
      additionalProperties: false
      required:
        - endpoint
        - secret
      properties:
        endpoint:
          $ref: '#/components/schemas/WebhookEndpoint'
        secret:
          type: string
          minLength: 43
          maxLength: 43
          readOnly: true
          description: Secret retornado uma única vez; não é recuperável por operações de leitura.
    UpdateWebhookRequest:
      type: object
      additionalProperties: false
      required:
        - expected_version
      minProperties: 2
      properties:
        name:
          type: string
          maxLength: 100
        expected_version:
          type: integer
          format: int64
          minimum: 1
        url:
          type: string
          format: uri
          pattern: ^https://
        description:
          type: string
          maxLength: 200
          description: String vazia limpa a descrição.
        enabled:
          type: boolean
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookSubscribableEventType'
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
    EmptyObjectRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    WebhookDeliveryStatus:
      type: string
      enum:
        - pending
        - delivered
        - failed
      description: |
        `pending` agrega os estados internos em fila, processamento e retry.
        `failed` também representa entregas canceladas porque o endpoint deixou
        de estar disponível.
    WebhookDeliverySummary:
      type: object
      required:
        - endpoint_id
        - state
        - delivery_id
        - event_type
        - status
        - attempt_count
        - created_at
        - updated_at
        - next_retry_at
        - delivered_at
        - last_response_code
        - last_duration_ms
        - is_test
        - replay_of_delivery_id
      properties:
        endpoint_id:
          $ref: '#/components/schemas/UUID'
        state:
          type: string
          enum:
            - queued
            - processing
            - retry_scheduled
            - delivered
            - failed
            - cancelled
        delivery_id:
          $ref: '#/components/schemas/UUID'
        event_type:
          $ref: '#/components/schemas/WebhookDeliveryEventType'
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        attempt_count:
          type: integer
          minimum: 0
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        next_retry_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        delivered_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_response_code:
          anyOf:
            - type: integer
              minimum: 100
              maximum: 599
            - type: 'null'
        last_duration_ms:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        is_test:
          type: boolean
        replay_of_delivery_id:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
    WebhookDeliveryPage:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliverySummary'
        next_cursor:
          type: string
          minLength: 1
          description: Cursor opaco para a página seguinte; ausente na última página.
    WebhookDeliveryAttempt:
      type: object
      additionalProperties: false
      required:
        - attempt
        - status
        - response_code
        - duration_ms
        - attempted_at
        - next_retry_at
        - response_hash_sha256
        - response_size_bytes
        - error_class
      properties:
        response_hash_sha256:
          type:
            - string
            - 'null'
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 da resposta; nunca seu conteúdo.
        response_size_bytes:
          type:
            - integer
            - 'null'
          minimum: 0
        error_class:
          type:
            - string
            - 'null'
          enum:
            - network
            - timeout
            - tls
            - blocked_destination
            - http_3xx
            - http_4xx
            - http_5xx
            - cancelled
            - null
          description: Diagnóstico limitado; null em sucesso ou tentativa legada sem classificação.
        attempt:
          type: integer
          minimum: 1
        status:
          type: string
          minLength: 1
          maxLength: 32
          description: Estado persistido da tentativa; consumidores não devem inferir o estado agregado por este campo.
        response_code:
          anyOf:
            - type: integer
              minimum: 100
              maximum: 599
            - type: 'null'
        duration_ms:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        attempted_at:
          $ref: '#/components/schemas/Timestamp'
        next_retry_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    WebhookPayloadRedacted:
      type: object
      additionalProperties: false
      description: |
        Visão por lista de permissão. Campos arbitrários do payload original,
        destinatários, conteúdo e URLs nunca são retornados.
      properties:
        event_type:
          $ref: '#/components/schemas/WebhookDeliveryEventType'
        message_id:
          $ref: '#/components/schemas/UUID'
        inbound_message_id:
          $ref: '#/components/schemas/UUID'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        test:
          type: boolean
    WebhookDeliveryDetail:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/WebhookDeliverySummary'
        - type: object
          required:
            - payload_redacted
            - attempts
            - requested_by
            - headers_permitted
          properties:
            headers_permitted:
              type: object
              additionalProperties: false
              description: Cabeçalhos invariantes reconstruídos; não contém timestamp nem assinatura por tentativa.
              properties:
                Content-Type:
                  type: string
                  const: application/json
                X-ViaPost-Delivery:
                  $ref: '#/components/schemas/UUID'
                X-ViaPost-Event:
                  type: string
                X-ViaPost-Payload-Version:
                  type: string
                  const: '1'
            requested_by:
              anyOf:
                - $ref: '#/components/schemas/WebhookRequestedBy'
                - type: 'null'
            payload_redacted:
              $ref: '#/components/schemas/WebhookPayloadRedacted'
            attempts:
              type: array
              items:
                $ref: '#/components/schemas/WebhookDeliveryAttempt'
    WebhookOperationAccepted:
      type: object
      required:
        - delivery_id
        - status
        - created_at
      properties:
        delivery_id:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          const: queued
        created_at:
          $ref: '#/components/schemas/Timestamp'
    WebhookTestAccepted:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/WebhookOperationAccepted'
        - type: object
          required:
            - is_test
          properties:
            is_test:
              type: boolean
              const: true
    WebhookReplayAccepted:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/WebhookOperationAccepted'
        - type: object
          required:
            - source_delivery_id
          properties:
            source_delivery_id:
              $ref: '#/components/schemas/UUID'
    RotateWebhookSecretResponse:
      type: object
      additionalProperties: false
      required:
        - endpoint
        - rotated_at
      properties:
        endpoint:
          $ref: '#/components/schemas/WebhookEndpoint'
        secret:
          type: string
          minLength: 43
          maxLength: 43
          readOnly: true
          description: Novo secret; presente somente na primeira resposta da rotação.
        rotated_at:
          $ref: '#/components/schemas/Timestamp'
  responses:
    ValidationError:
      description: validation_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DynamicSegmentMembershipConflict:
      description: dynamic_segment_membership; segmentos dinâmicos não aceitam membership manual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DynamicSegmentMembershipError'
    Unauthorized:
      description: unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: forbidden ou tenant_inactive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: not_found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: conflict, no_active_tenant ou webhook_replay_conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: rate_limited ou quota_exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Segundos até nova tentativa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: internal_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: payload_too_large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: service_unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
