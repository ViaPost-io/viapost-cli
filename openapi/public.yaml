  /v1/suppressions/import:
    post:
      operationId: postSuppressionsImport
      tags:
        - Suppressions
      summary: Importa supressões manuais de um CSV
      description: |
        Recebe UTF-8 com o cabeçalho exato `email,reason,expires_at,note`, no máximo 2 MiB e
        1.000 registros. `expires_at` e `note` podem ficar vazios. O arquivo inteiro é validado
        antes da escrita e a importação é atômica: qualquer linha inválida rejeita tudo.
        Endereços repetidos no mesmo arquivo são contabilizados em `duplicates`.
      security:
        - bearerApiKey: []
        - sessionCookie: []
