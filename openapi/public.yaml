openapi: 3.1.1
info:
  title: ViaPost Integration API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://viapost.io/terms
  description: |
    Contrato descritivo do comportamento atual da api-core. Alterações incompatíveis exigem versão e depreciação.
servers:
  - url: https://api.viapost.io
paths:
  /.well-known/oauth-protected-resource:
    get:
      operationId: getOAuthProtectedResourceMetadata
      tags:
        - MCP OAuth
      summary: OAuth Protected Resource Metadata para o recurso MCP
      description: Retorna resource, authorization_servers, bearer_methods_supported e scopes_supported. Resposta sempre pública e sem cache.
      security: []
      responses:
        '200':
          description: Metadados RFC 9728 do recurso protegido.
        '503':
          description: temporarily_unavailable quando assinatura OAuth não está configurada.
  /.well-known/oauth-authorization-server:
    get:
      operationId: getOAuthAuthorizationServerMetadata
      tags:
        - MCP OAuth
      summary: Metadados do authorization server OAuth
      description: Declara authorization_code e refresh_token, PKCE S256, endpoints de autorização, token, revogação e JWKS; registration_endpoint só aparece quando DCR está habilitado.
      security: []
      responses:
        '200':
          description: Metadados OAuth públicos, sem cache.
  /.well-known/jwks.json:
    get:
      operationId: getOAuthJWKS
      tags:
        - MCP OAuth
      summary: Chaves públicas para validar tokens MCP
      security: []
      responses:
        '200':
          description: JWK Set Ed25519 público.
        '503':
          description: temporarily_unavailable quando a chave de assinatura não está configurada.
  /oauth/authorize:
    get:
      operationId: getOAuthAuthorize
      tags:
        - MCP OAuth
      summary: Exibe consentimento OAuth humano
      description: Requer sessão humana com tenant ativo; sem sessão redireciona ao login. Valida response_type=code, client_id, redirect_uri, scope, code_challenge e code_challenge_method=S256; reserva estado de consentimento de uso único com expiração de cinco minutos e renderiza formulário. Não cria grant nesta etapa.
      security:
        - sessionCookie: []
      parameters:
        - name: response_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - code
            default: code
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
      responses:
        '200':
          description: HTML de consentimento vinculado à sessão, tenant e request.
        '302':
          description: Redireciona ao login quando não existe sessão válida.
        '400':
          description: invalid_request para parâmetros inválidos.
        '401':
          description: Cliente OAuth inválido ou não autorizado.
        '500':
          description: Falha ao renderizar a página de consentimento.
        '503':
          description: temporarily_unavailable.
    post:
      operationId: postOAuthAuthorize
      tags:
        - MCP OAuth
      summary: Registra decisão explícita de consentimento OAuth
      description: Recebe formulário URL-encoded com os parâmetros do GET, consent_token, decision=approve|deny e csrf_token. Exige sessão humana, tenant ativo, Origin same-origin e X-ViaPost-Csrf igual ao csrf_token. Consome o estado uma única vez; redireciona ao redirect_uri previamente validado com code ou access_denied.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
                - client_id
                - redirect_uri
                - scope
                - code_challenge
                - code_challenge_method
                - consent_token
                - decision
                - csrf_token
              properties:
                response_type:
                  type: string
                  enum:
                    - code
                client_id:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                scope:
                  type: string
                state:
                  type: string
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                  const: S256
                consent_token:
                  type: string
                decision:
                  type: string
                  enum:
                    - approve
                    - deny
                csrf_token:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Redirect URI validado com authorization code ou access_denied quando Accept contém application/json.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - redirect_uri
                properties:
                  redirect_uri:
                    type: string
                    format: uri
        '302':
          description: Redirect URI validado com authorization code ou access_denied.
        '400':
          description: invalid_request.
        '403':
          description: access_denied para sessão, CSRF, origem ou estado inválido.
        '503':
          description: temporarily_unavailable.
  /oauth/register:
    post:
      operationId: postOAuthRegisterClient
      tags:
        - MCP OAuth
      summary: Registra cliente OAuth público por Dynamic Client Registration
      description: Disponível somente com DCR habilitado. Corpo JSON estrito, máximo 64 KiB. Apenas cliente público sem autenticação no token endpoint, authorization_code, response_type code, redirects validados e scopes suportados são aceitos. Respostas não são armazenadas em cache.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - client_name
                - redirect_uris
                - grant_types
                - response_types
                - token_endpoint_auth_method
                - scope
              properties:
                client_name:
                  type: string
                redirect_uris:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uri
                grant_types:
                  type: array
                  items:
                    type: string
                    enum:
                      - authorization_code
                response_types:
                  type: array
                  items:
                    type: string
                    enum:
                      - code
                token_endpoint_auth_method:
                  type: string
                  enum:
                    - none
                scope:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: Client metadata with client_id and supported metadata; no client secret is issued.
        '400':
          description: invalid_client_metadata.
        '409':
          description: invalid_client_metadata for conflicting registration metadata.
        '429':
          description: Rate limit or global DCR limit reached.
        '503':
          description: temporarily_unavailable when DCR is disabled or unavailable.
  /oauth/token:
    post:
      operationId: postOAuthToken
      tags:
        - MCP OAuth
      summary: Troca authorization code ou refresh token por token OAuth
      description: Form URL-encoded; authorization_code exige client_id, redirect_uri, code e code_verifier; refresh_token exige client_id e refresh_token. O access token é audience-bound ao recurso MCP e tem scopes concedidos; refresh token é rotacionado e replay revoga a família.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
                - grant_type
                - client_id
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                client_id:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                code:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: OAuth token response; sensitive token fields are never logged or exposed elsewhere.
        '400':
          description: invalid_request or invalid_grant.
        '401':
          description: invalid_client.
        '429':
          description: Rate limit reached.
        '503':
          description: temporarily_unavailable.
  /oauth/revoke:
    post:
      operationId: postOAuthRevoke
      tags:
        - MCP OAuth
      summary: Revoga token OAuth apresentado pelo chamador
      description: Form URL-encoded com token. A posse do token é a autoridade de revogação; identificador de grant arbitrário não é aceito. A resposta não revela se o token existia.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Revogação neutra, inclusive quando o token não é reconhecido.
        '400':
          description: invalid_request.
        '429':
          description: Rate limit reached.
        '503':
          description: temporarily_unavailable.
  /v1/broadcasts/manage:
    get:
      operationId: getBroadcastsManage
      tags:
        - Broadcasts
      summary: Consulta visão paginada de gerenciamento de campanhas
      description: Tenant-scoped. Filtros q, status, target_kind, segment_id, created_from, created_to, sort, order, page e page_size; private, no-store.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: broadcasts:read
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: string
        - name: target_kind
          in: query
          schema:
            type: string
            enum:
              - all_contacts
              - segment
        - name: segment_id
          in: query
          schema:
            type: string
            format: uuid
        - name: created_from
          in: query
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Resultado paginado de gerenciamento de campanhas.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/broadcasts/overview:
    get:
      operationId: getBroadcastsOverview
      tags:
        - Broadcasts
      summary: Consulta métricas agregadas de campanhas
      description: Tenant-scoped. Aceita created_from/to, target_kind e segment_id; resposta private, no-store.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: broadcasts:read
      parameters:
        - name: created_from
          in: query
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          schema:
            type: string
            format: date-time
        - name: target_kind
          in: query
          schema:
            type: string
            enum:
              - all_contacts
              - segment
        - name: segment_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Métricas agregadas de campanhas no intervalo/segmento.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/broadcasts/{id}/analytics:
    get:
      operationId: getBroadcastsIdAnalytics
      tags:
        - Broadcasts
      summary: Consulta analytics de uma campanha
      description: Tenant-scoped e private, no-store. Datas from/to aceitam YYYY-MM-DD; top_links_limit entre 1 e 20, padrão 10.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: broadcasts:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: top_links_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Métricas detalhadas de campanha.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/automations:
    get:
      operationId: getAutomations
      tags:
        - Automations
      summary: GET /v1/automations
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: automations:read
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - disabled
              - enabled
              - archived
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: postAutomations
      tags:
        - Automations
      summary: POST /v1/automations
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: automations:write
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutomationRequest'
      responses:
        '201':
          description: Sucesso
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
              description: Impede cache da resposta que contém o secret inicial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/automations/{id}:
    get:
      operationId: getAutomationsId
      tags:
        - Automations
      summary: GET /v1/automations/{id}
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: automations:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchAutomationsId
      tags:
        - Automations
      summary: PATCH /v1/automations/{id}
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: automations:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameAutomationRequest'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteAutomationsId
      tags:
        - Automations
      summary: DELETE /v1/automations/{id}
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: automations:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/automations/{id}/activate:
    post:
      operationId: postAutomationsIdActivate
      tags:
