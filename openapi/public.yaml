components:
  parameters:
    TimestampCursor:
      name: cursor
      in: query
      description: Cursor RFC 3339 exclusivo; ausente ou inválido usa um instante futuro.
      schema: { type: string, format: date-time }
    LegacyLimit:
      name: limit
      in: query
      description: Quantidade solicitada; ausente, não numérica ou não positiva usa 50.
      schema: { type: integer, minimum: 1, default: 50 }
    AutomationCursor:
      name: cursor
      in: query
      description: Cursor opaco base64url retornado pela API; timestamps RFC 3339 legados também são aceitos.
      schema: { type: string }
    AutomationLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Days:
      name: days
      in: query
      description: Valores não positivos ou inválidos usam 14; valores acima de 90 são limitados a 90.
      schema: { type: integer, minimum: 1, maximum: 90, default: 14 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 255 }
    CsrfHeader:
      name: X-ViaPost-Csrf
      in: header
      required: false
      description: Obrigatório somente quando autenticado pelo cookie de sessão.
      schema: { type: string, minLength: 1 }
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
