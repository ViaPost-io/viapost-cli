        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/automations/{id}/draft:
    patch:
      operationId: patchAutomationsIdDraft
      tags:
        - Automations
      summary: PATCH /v1/automations/{id}/draft
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: automations:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAutomationDraftRequest'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/automations/{id}/recipes/saas-onboarding:
    patch:
      operationId: patchAutomationsIdRecipesSaasOnboarding
      tags:
        - Automations
      summary: Materializar a receita de onboarding SaaS em rascunho
      description: |
        Exclusiva da sessão do painel. Constrói o grafo no servidor e registra
        a proveniência somente junto de um salvamento bem-sucedido. Não ativa
        a automação nem comprova execução ou uso histórico.
      security:
        - sessionCookie: []
      x-viapost-scope: automations:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RequiredCsrfHeader'
        - name: X-ViaPost-Expected-Tenant-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterializeSaasOnboardingRecipeRequest'
      responses:
        '200':
          description: Rascunho materializado ou retry idempotente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/automations/{id}/duplicate:
    post:
      operationId: postAutomationsIdDuplicate
      tags:
        - Automations
      summary: POST /v1/automations/{id}/duplicate
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: automations:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
