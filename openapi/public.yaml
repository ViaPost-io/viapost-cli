  /v1/suppressions/export:
    get:
      operationId: getSuppressionsExport
      tags:
        - Suppressions
      summary: Exporta supressões do tenant em CSV
      description: |
        Exporta o conjunto filtrado com cabeçalho `email,reason,state,origin,expires_at,note,updated_at`.
        Valores iniciados por caracteres de fórmula são neutralizados para impedir formula
        injection ao abrir o arquivo em uma planilha. O CSV nunca contém diagnóstico SMTP bruto.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: suppressions:read
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 254
        - name: reason
          in: query
          schema:
            $ref: '#/components/schemas/SuppressionReason'
        - name: state
          in: query
          schema:
            type: string
            enum:
              - active
              - expired
              - released
              - all
            default: active
        - name: origin
          in: query
          schema:
            $ref: '#/components/schemas/SuppressionOrigin'
      responses:
        '200':
          description: Arquivo CSV UTF-8.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="viapost-suppressions.csv"
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
