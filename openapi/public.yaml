  /v1/broadcasts/{id}/send-plans:
    post:
      operationId: postBroadcastsIdSendPlans
      tags:
        - Broadcasts
      summary: Prepara um plano imutável para agendamento MCP
      description: |
        Captura a versão da campanha, remetente/domínio verificado e até 1.000 IDs de contatos
        elegíveis sem agendar ou enviar mensagens. O plano expira em dez minutos e sua resposta
        contém apenas um resumo server-derived, o hash opaco e a contagem; não contém endereços
        dos destinatários. Requer OAuth MCP com broadcasts:write e um tenant habilitado no rollout.
      security:
        - mcpOAuth:
            - broadcasts:write
      x-viapost-scope: broadcasts:write
      x-viapost-mcp-scopes:
        - broadcasts:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expected_version
                - scheduled_at
              additionalProperties: false
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                scheduled_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Plano de envio preparado; nenhuma mensagem foi agendada
          content:
            application/json:
              schema:
                type: object
                required:
                  - plan_id
                  - plan_hash
                  - expires_at
                  - summary
                  - eligible_contact_count
                properties:
                  plan_id:
                    type: string
                    format: uuid
                  plan_hash:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                  expires_at:
                    type: string
                    format: date-time
                  eligible_contact_count:
                    type: integer
                    minimum: 1
                    maximum: 1000
                  summary:
                    type: object
                    description: Resumo derivado da campanha, sem dados dos destinatários.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/broadcasts/{id}/schedule:
    post:
      operationId: postBroadcastsIdSchedule
      tags:
        - Broadcasts
      summary: Materializa a audiência e agenda o broadcast imediatamente
      description: |
        Aceita somente draft na versão informada. Materializa até 1.000 contatos elegíveis e agenda
        o início para aproximadamente um segundo após a solicitação. Audiência vazia ou acima do
        limite retorna `400`; versão/estado incompatível ou domínio não mais verificado retorna `409`.
        Exige exatamente um `Idempotency-Key`; a mesma chave e solicitação devolvem o resultado
        persistido por 30 dias, e reutilização para outra campanha/versão/approval retorna `409`.
        OAuth MCP exige `plan_id`, `plan_hash`, um `approval_id` aprovado pelo proprietário em
        `X-ViaPost-MCP-Approval-ID` e `Idempotency-Key`. A API verifica e consome o plano com sua
        audiência UUID imutável, aprovação, resultado idempotente e auditoria na mesma transação.
        O agendamento é fail-closed e retorna `503 service_unavailable` sem materializar a audiência
        quando o gate de execução está desabilitado ou o tenant não está autorizado para o rollout.
      security:
        - bearerApiKey: []
        - sessionCookie: []
        - mcpOAuth:
            - broadcasts:write
            - broadcasts:send
      x-viapost-scope: broadcasts:write
      x-viapost-required-scopes:
        - broadcasts:write
        - email:send
      x-viapost-mcp-scopes:
        - broadcasts:write
        - broadcasts:send
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/BroadcastIdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BroadcastVersionRequest'
                - $ref: '#/components/schemas/MCPBroadcastScheduleRequest'
      responses:
        '200':
          description: Audiência materializada e broadcast agendado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Gate de agendamento negado; envelope genérico com `error.code=service_unavailable` e `error.message=internal server error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
