        '202':
          description: Resultado de cada item na ordem da requisição, incluindo erros por item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSendResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
