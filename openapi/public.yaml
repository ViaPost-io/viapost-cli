          schema:
            type: string
          description: Cursor opaco retornado em `next_cursor`.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: search
          in: query
          schema:
            type: string
            maxLength: 254
          description: Busca parcial sem diferenciação de maiúsculas no endereço.
        - name: reason
          in: query
          schema:
            $ref: '#/components/schemas/SuppressionReason'
        - name: state
          in: query
          schema:
            type: string
            enum:
              - active
              - expired
              - released
              - all
            default: active
        - name: origin
          in: query
          schema:
            $ref: '#/components/schemas/SuppressionOrigin'
      responses:
        '200':
          description: Página de supressões em ordem decrescente de atualização.
