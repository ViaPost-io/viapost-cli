openapi: 3.1.1
info:
  title: ViaPost Integration API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://viapost.io/terms
  description: |
    Contrato descritivo do comportamento atual da api-core. Alterações incompatíveis exigem versão e depreciação.
servers:
  - url: https://api.viapost.io
paths:
  /v1/automations:
    get:
      operationId: getAutomations
      tags:
        - Automations
      summary: GET /v1/automations
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: automations:read
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - disabled
              - enabled
              - archived
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: postAutomations
      tags:
        - Automations
      summary: POST /v1/automations
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: automations:write
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutomationRequest'
      responses:
        '201':
          description: Sucesso
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
              description: Impede cache da resposta que contém o secret inicial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/automations/{id}:
    get:
      operationId: getAutomationsId
      tags:
        - Automations
      summary: GET /v1/automations/{id}
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: automations:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
