  /v1/messages/{id}/raw:
    get:
      operationId: getMessagesIdRaw
      tags:
        - Messages
      summary: Baixa o arquivo RFC 5322 submetido
      description: |
        Retorna o `.eml` armazenado no momento da submissão, antes da reescrita de links e pixel de
        tracking e antes da assinatura DKIM aplicada pelo MTA. Portanto, este arquivo é evidência do
        conteúdo submetido, não uma cópia byte a byte da mensagem entregue ao destinatário. A
        autorização e o isolamento por tenant são reavaliados em cada download.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: messages:content:read
      x-viapost-required-scopes:
        - messages:read
        - messages:content:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Arquivo `.eml` submetido.
          headers:
            Cache-Control:
              description: Impede armazenamento de conteúdo sensível por caches compartilhados ou privados.
              schema:
                type: string
                const: private, no-store
            Content-Disposition:
              description: Força download com nome de arquivo derivado exclusivamente do ID da mensagem.
              schema:
                type: string
                example: attachment; filename="00000000-0000-0000-0000-000000000000.eml"
            X-Content-Type-Options:
              description: Impede MIME sniffing no navegador.
              schema:
                type: string
                const: nosniff
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
