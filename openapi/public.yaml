      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Arquivo `.eml` recebido.
          headers:
            Cache-Control:
              description: Impede armazenamento de conteúdo sensível por caches compartilhados ou privados.
              schema:
                type: string
                const: private, no-store
            Content-Disposition:
              description: Força download com nome de arquivo derivado exclusivamente do ID da mensagem.
              schema:
                type: string
                example: attachment; filename="00000000-0000-0000-0000-000000000000.eml"
            X-Content-Type-Options:
              description: Impede MIME sniffing no navegador.
              schema:
                type: string
                const: nosniff
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
