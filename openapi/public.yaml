  /v1/messages/events:
    get:
      operationId: getMessagesEvents
      tags:
        - Messages
      summary: Lista a timeline tenant-wide de eventos de mensagens
      description: |
        Sem `include`, mantém a timeline outbound e seus cursores v1 exatamente como antes.
        `include=inbound` acrescenta recebimentos comuns positivamente classificados do tenant,
        usa cursor v2 e exige simultaneamente `messages:read` e `inbound:read`. Entradas técnicas,
        históricas ambíguas e não classificadas não aparecem. `message_id` é inválido no modo
        misto. Não inclui eventos customizados, execuções de automação, operações de webhook nem
        eventos de auditoria. O endpoint legado `/v1/messages/{id}/events` não muda.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: messages:read
      x-viapost-additional-scope-when-include-inbound: inbound:read
      parameters:
        - name: include
          in: query
          description: O valor `inbound` habilita a página mista e exige também `inbound:read`.
          schema:
            type: string
            enum:
              - inbound
        - name: cursor
          in: query
          description: Cursor opaco retornado em `next_cursor`; não deve ser interpretado ou alterado pelo cliente.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          description: Quantidade máxima de eventos retornados.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: period
          in: query
          description: Janela relativa ao instante da consulta; usa `24h` quando omitida.
          schema:
            type: string
            enum:
              - 24h
              - 7d
              - 14d
              - 30d
            default: 24h
        - name: type
          in: query
          description: '`inbound.received` só é aceito com `include=inbound`; os demais tipos filtram outbound.'
          schema:
            $ref: '#/components/schemas/MessageTimelineFilterType'
        - name: message_id
          in: query
          description: Filtra pelo UUID de mensagem outbound; incompatível com `include=inbound`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Página de eventos, ordenada por `occurred_at` decrescente com desempate estável.
          headers:
            Cache-Control:
              description: Impede cache de metadados de destinatários e diagnósticos de entrega.
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MessageTimelinePage'
                  - $ref: '#/components/schemas/MessageTimelineOptInPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/messages/metrics:
    get:
      operationId: getMessagesMetrics
      tags:
        - Messages
      summary: Retorna métricas consolidadas de mensagens e entregabilidade
      description: |
        Retorna as métricas atuais e anteriores, séries temporais, agregação por domínio remetente
        e as agregações de entregabilidade. A extensão `deliverability` é aditiva; os campos
        existentes permanecem inalterados.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: messages:read
      parameters:
        - $ref: '#/components/parameters/Days'
        - name: domain_id
          in: query
          description: Filtra as métricas, inclusive `deliverability`, pelo UUID do domínio remetente.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sucesso
          headers:
