        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: automations:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/contacts:
    get:
      operationId: getContacts
      tags:
        - Contacts
      summary: GET /v1/contacts
      description: Lista somente os contatos ativos do tenant autenticado. `Audience` e `audience` são nomes internos; não existe rota pública `/v1/audiences`.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: contacts:read
      parameters:
        - $ref: '#/components/parameters/AutomationCursor'
        - $ref: '#/components/parameters/AutomationLimit'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: Busca por e-mail ou nome do contato; máximo de 200 caracteres.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: postContacts
      tags:
        - Contacts
      summary: POST /v1/contacts
      description: Cria um contato. O e-mail é normalizado para minúsculas e deve ser único dentro do tenant; a mesma caixa postal pode existir em outro tenant.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: contacts:write
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/contacts/import:
    post:
      operationId: postContactsImport
      tags:
        - Contacts
      summary: POST /v1/contacts/import
      description: |
        Importação síncrona, atômica e somente de criação para no máximo 1.000 contatos do tenant.
        Aceita CSV UTF-8 (BOM opcional) com cabeçalho exato `email,first_name,last_name,subscribed,properties`.
        Contatos existentes não são alterados; duplicatas do arquivo preservam a primeira linha válida.
        `subscribed` vazio cria contato não inscrito por padrão seguro de consentimento.
      security:
        - bearerApiKey: []
        - sessionCookie: []
      x-viapost-scope: contacts:write
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
              maxLength: 2097152
      responses:
        '200':
          description: Importação concluída; totais são calculados a partir do resultado real do banco.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactImportResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
